<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="goldSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <linearGradient id="sealGradHPL2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE8D5"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8D5"/>
    </linearGradient>
  </defs>

  <!-- Background in warm alabaster / light sage palette -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#goldSage)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Top Institutional Header: SMVITM -->
  <g transform="translate(480, 72)">
    <!-- Trophy with Laurel Wreath -->
    <circle cx="0" cy="0" r="24" fill="#DCE8D5" stroke="#526B50" stroke-width="1.5"/>
    <!-- Trophy cup -->
    <path d="M-10 -9 H10 V-2 C10 6 -10 6 -10 -2 Z" fill="#526B50"/>
    <path d="M-13 -7 H-10 V-2 C-10 0 -13 0 -13 -2 Z" stroke="#526B50" stroke-width="1.5" fill="none"/>
    <path d="M13 -7 H10 V-2 C10 0 13 0 13 -2 Z" stroke="#526B50" stroke-width="1.5" fill="none"/>
    <rect x="-2" y="6" width="4" height="6" fill="#526B50"/>
    <rect x="-7" y="12" width="14" height="3" rx="1" fill="#526B50"/>
  </g>

  <text x="480" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#343D32" letter-spacing="1">
    SHRI MADHWA VADIRAJA INSTITUTE OF TECHNOLOGY &amp; MANAGEMENT
  </text>
  <text x="480" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#526B50" letter-spacing="0.5">
    Vishwothama Nagar, Bantakal, Udupi – 574 115, Karnataka
  </text>

  <!-- Association Partners Bar -->
  <g transform="translate(480, 158)">
    <rect x="-280" y="-12" width="560" height="24" rx="12" fill="#DCE8D5" stroke="#A3B899" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#343D32" letter-spacing="1">
      IN ASSOCIATION WITH: CODETROOPERS • IAHV • IGNITE • SHIRVA POLICE
    </text>
  </g>

  <!-- Certificate Award Title -->
  <text x="480" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="30" font-weight="900" fill="#343D32" letter-spacing="2">
    2nd Runner-Up Award
  </text>
  <text x="480" y="234" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#526B50" letter-spacing="3">
    HACKATHON PREMIER LEAGUE
  </text>

  <line x1="360" y1="248" x2="600" y2="248" stroke="#526B50" stroke-width="1.8"/>

  <!-- Presentation text -->
  <text x="480" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#526B50">
    This prestigious award is presented to
  </text>

  <!-- Recipient Name -->
  <text x="480" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="#343D32" letter-spacing="1">
    Zeenath Ziyan
  </text>
  <line x1="260" y1="346" x2="700" y2="346" stroke="#526B50" stroke-width="1.8"/>

  <!-- Achievement Description Body -->
  <text x="480" y="378" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#343D32">
    for securing the prestigious 2nd RUNNER UP POSITION in the competitive
  </text>
  <text x="480" y="400" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#526B50">
    HACKATHON PREMIER LEAGUE held from 16th September to 1st October 2026.
  </text>

  <!-- Event Summary Badge -->
  <g transform="translate(480, 436)">
    <rect x="-210" y="-12" width="420" height="26" rx="8" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.2"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#526B50">
      Podium Finish • Top 3 Engineering Innovation Award
    </text>
  </g>

  <!-- =========================================================================
       AUTHORITIES, SIGNATURES & OFFICIAL SEAL (ZERO EMPTY SPACE)
       ========================================================================= -->

  <!-- Left Authority: Co-curricular Coordinator -->
  <g transform="translate(200, 520)">
    <!-- Realistic Cursive Handwritten Signature -->
    <path d="M-65 -8 C-45 -35 -25 8 -10 -15 C5 -32 20 5 45 -10 C60 -22 75 0 85 -5" fill="none" stroke="#343D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-40 2 C-10 10 20 -2 55 4" fill="none" stroke="#526B50" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#343D32">Co-curricular Coordinator</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#526B50">SMVITM, BANTAKAL</text>
  </g>

  <!-- Center: Official SMVITM Institutional Stamp -->
  <g transform="translate(480, 520)">
    <circle cx="0" cy="0" r="34" fill="url(#sealGradHPL2)" stroke="#526B50" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(52,61,50,0.1))"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#A3B899" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="0" y="-8" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#526B50">SMVITM</text>
    <text x="0" y="4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#343D32">2ND RUNNER-UP</text>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="bold" fill="#76946C">OFFICIAL SEAL</text>
  </g>

  <!-- Right Authority: Principal, SMVITM -->
  <g transform="translate(760, 520)">
    <!-- Realistic Cursive Handwritten Signature -->
    <path d="M-70 2 C-50 -28 -30 12 -12 -18 C2 -35 25 5 45 -12 C62 -25 78 -2 88 -8" fill="none" stroke="#343D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-50 8 C-15 -4 20 8 60 2" fill="none" stroke="#526B50" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#343D32">Principal</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#526B50">SMVITM, BANTAKAL</text>
  </g>

  <!-- Top-Right Verification QR Badge -->
  <g transform="translate(850, 90)">
    <rect x="-26" y="-26" width="52" height="52" rx="6" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <rect x="-20" y="-20" width="14" height="14" fill="#343D32"/><rect x="-17" y="-17" width="8" height="8" fill="#FFFFFF"/>
    <rect x="6" y="-20" width="14" height="14" fill="#343D32"/><rect x="9" y="-17" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-20" y="6" width="14" height="14" fill="#343D32"/><rect x="-17" y="9" width="8" height="8" fill="#FFFFFF"/>
    <rect x="4" y="4" width="8" height="8" fill="#526B50"/><rect x="12" y="12" width="6" height="6" fill="#343D32"/>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="bold" fill="#526B50">VERIFIED</text>
  </g>
</svg>