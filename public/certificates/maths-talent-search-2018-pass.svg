<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#343D32" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#sageGrad)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Left Header: KAM Emblem -->
  <g transform="translate(145, 90)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#526B50"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">KAM</text>
  </g>

  <!-- Right Ribbon: Exam Year & Status Stamp -->
  <g transform="translate(770, 95)" filter="url(#shadow)">
    <rect x="-95" y="-20" width="190" height="180" rx="14" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#526B50" letter-spacing="1.2">MATHS TALENT SEARCH</text>
    
    <!-- Rosette Stamp -->
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="28" fill="#DCE8D5" stroke="#526B50" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" fill="#526B50"/>
      <text x="0" y="-3" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">PASS</text>
      <text x="0" y="9" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#DCE8D5">VERIFIED</text>
    </g>

    <text x="0" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">Examination Year:</text>
    <text x="0" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#343D32">Year 2018</text>
    
    <!-- Mini QR Code -->
    <g transform="translate(0, 138)">
      <rect x="-12" y="-12" width="24" height="24" fill="#FFFFFF" stroke="#DCE8D5"/>
      <rect x="-9" y="-9" width="6" height="6" fill="#343D32"/><rect x="3" y="-9" width="6" height="6" fill="#343D32"/>
      <rect x="-9" y="3" width="6" height="6" fill="#343D32"/><rect x="1" y="1" width="4" height="4" fill="#526B50"/>
    </g>
  </g>

  <!-- Institution Header -->
  <text x="420" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#526B50" letter-spacing="1.5">
    KARNATAKA ACADEMY OF MATHEMATICS
  </text>
  <text x="420" y="140" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#76946C">
    Fostering Mathematical Aptitude &amp; Logical Reasoning
  </text>

  <!-- Title Area -->
  <text x="420" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="28" font-weight="900" fill="#343D32" letter-spacing="1">
    National Level Maths Talent Search Exam
  </text>
  <text x="420" y="206" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#526B50">
    This Certificate is proudly presented to
  </text>

  <!-- Recipient Name -->
  <text x="420" y="255" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#343D32" letter-spacing="1">
    ZEENATH ZIYAN
  </text>
  <line x1="200" y1="270" x2="640" y2="270" stroke="#526B50" stroke-width="1.8"/>

  <!-- Academic info -->
  <text x="420" y="295" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#526B50">
    Student of VII Standard  •  M.E.T. Public School
  </text>

  <!-- Result statement -->
  <g transform="translate(420, 335)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#343D32">
      for participating and qualifying in the National Level Maths Talent Search Examination
    </text>
    <rect x="-180" y="18" width="360" height="40" rx="8" fill="#F0F4EE" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#526B50">
      Secured PASS Class in School/College Level
    </text>
  </g>

  <!-- Authority & Signature -->
  <g transform="translate(420, 485)">
    <!-- Realistic Cursive Signature -->
    <path d="M-55 -10 C-35 -30 -10 12 10 -15 C28 -28 45 5 70 -8" fill="none" stroke="#343D32" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-25 0 C-5 10 20 -2 50 4" fill="none" stroke="#526B50" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-75" y1="14" x2="75" y2="14" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#343D32">Manjunatha H</text>
    <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#526B50">Convener, Karnataka Academy of Mathematics</text>
  </g>

  <text x="480" y="590" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#76946C">
    Affiliated examinations promoting excellence in numerical reasoning and foundational mathematics
  </text>
</svg>