<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#343D32" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#sageGrad)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Left Header: GNELS Emblem -->
  <g transform="translate(145, 90)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#526B50"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">GNELS</text>
  </g>

  <!-- Right Ribbon: State Level Competition Stamp -->
  <g transform="translate(770, 95)" filter="url(#shadow)">
    <rect x="-95" y="-20" width="190" height="180" rx="14" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#526B50" letter-spacing="1.2">STATE LEVEL ABACUS</text>
    
    <!-- Rosette Stamp -->
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="28" fill="#DCE8D5" stroke="#526B50" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" fill="#526B50"/>
      <text x="0" y="-3" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF">IV LEVEL</text>
      <text x="0" y="9" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#DCE8D5">VERIFIED</text>
    </g>

    <text x="0" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">Competition Date:</text>
    <text x="0" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#343D32">21st January 2018</text>
    
    <!-- Mini QR Code -->
    <g transform="translate(0, 138)">
      <rect x="-12" y="-12" width="24" height="24" fill="#FFFFFF" stroke="#DCE8D5"/>
      <rect x="-9" y="-9" width="6" height="6" fill="#343D32"/><rect x="3" y="-9" width="6" height="6" fill="#343D32"/>
      <rect x="-9" y="3" width="6" height="6" fill="#343D32"/><rect x="1" y="1" width="4" height="4" fill="#526B50"/>
    </g>
  </g>

  <!-- Institution Header -->
  <text x="420" y="120" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#526B50" letter-spacing="1.5">
    GURUKULA NEO EDUCATIONAL LEARNING SYSTEMS (GNELS)
  </text>
  <text x="420" y="140" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#76946C">
    Pioneering Mental Arithmetic &amp; Abacus Excellence
  </text>

  <!-- Title Area -->
  <text x="420" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="30" font-weight="900" fill="#343D32" letter-spacing="1">
    Certificate of Merit &amp; Participation
  </text>
  <text x="420" y="208" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#526B50">
    Awarded to
  </text>

  <!-- Recipient Name -->
  <text x="420" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#343D32" letter-spacing="1">
    Zeenath Ziyan
  </text>
  <line x1="200" y1="276" x2="640" y2="276" stroke="#526B50" stroke-width="1.8"/>

  <!-- Competition Details -->
  <g transform="translate(420, 315)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#343D32">
      for outstanding performance and active participation in the
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#526B50" letter-spacing="0.5">
      State Level Abacus Competition (IV Level)
    </text>
    <text x="0" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#555555">
      Held at Alva&apos;s English Medium High School, Moodabidri
    </text>
    <text x="0" y="82" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#343D32">
      Conducted on 21st January 2018
    </text>
  </g>

  <!-- Authority & Signature -->
  <g transform="translate(420, 485)">
    <!-- Realistic Cursive Signature -->
    <path d="M-60 -5 C-40 -25 -10 15 15 -15 C35 -25 55 5 75 -10" fill="none" stroke="#343D32" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-30 4 C0 12 30 -2 60 4" fill="none" stroke="#526B50" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-80" y1="14" x2="80" y2="14" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#343D32">Lakshmi G Hegde</text>
    <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#526B50">Director, GNELS</text>
  </g>

  <text x="480" y="590" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#76946C">
    Recognizing cognitive speed, mental arithmetic computation, and analytical accuracy
  </text>
</svg>