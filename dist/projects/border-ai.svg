<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSurv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B241A"/>
      <stop offset="50%" stop-color="#2D3A2C"/>
      <stop offset="100%" stop-color="#41553F"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A3B899" stop-opacity="0"/>
      <stop offset="50%" stop-color="#DCE8D5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A3B899" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgSurv)"/>
  
  <!-- Grid Lines -->
  <g stroke="#526B50" stroke-width="0.8" opacity="0.3">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
  </g>

  <!-- Surveillance Camera Target / Reticle -->
  <g transform="translate(320, 180)">
    <circle cx="0" cy="0" r="100" fill="none" stroke="#DCE8D5" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#A3B899" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="0" r="8" fill="#DCE8D5"/>

    <!-- Target Brackets -->
    <path d="M-80 -80 L-60 -80 M-80 -80 L-80 -60" stroke="#DCE8D5" stroke-width="3" fill="none"/>
    <path d="M80 -80 L60 -80 M80 -80 L80 -60" stroke="#DCE8D5" stroke-width="3" fill="none"/>
    <path d="M-80 80 L-60 80 M-80 80 L-80 60" stroke="#DCE8D5" stroke-width="3" fill="none"/>
    <path d="M80 80 L60 80 M80 80 L80 60" stroke="#DCE8D5" stroke-width="3" fill="none"/>

    <!-- AI Bounding Box -->
    <rect x="-45" y="-55" width="90" height="110" rx="6" fill="#526B50" fill-opacity="0.25" stroke="#DCE8D5" stroke-width="2"/>
    <rect x="-45" y="-72" width="75" height="16" rx="4" fill="#526B50"/>
    <text x="-40" y="-60" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#F7F5EC">OBJECT: 98%</text>
  </g>

  <!-- Status Bar Top -->
  <rect x="24" y="24" width="592" height="34" rx="8" fill="#1B241A" fill-opacity="0.8" stroke="#526B50" stroke-width="1"/>
  <circle cx="44" cy="41" r="5" fill="#EF4444"/>
  <text x="58" y="45" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" fill="#F7F5EC">REC • LIVE AI SURVEILLANCE FEED</text>
  <text x="590" y="45" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#DCE8D5">PS ID: 26187</text>

  <!-- Title Bottom -->
  <rect x="0" y="330" width="640" height="70" fill="#1B241A" fill-opacity="0.95"/>
  <text x="32" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Border AI Video Analytics</text>
  <text x="32" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#DCE8D5">Intelligent CCTV Edge Detection &amp; Automated Alerts</text>
</svg>
