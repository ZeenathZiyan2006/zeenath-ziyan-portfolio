<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#343D32" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#sageGrad)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Left Header: SMVITM Logo Badge -->
  <g transform="translate(145, 90)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#526B50"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">SMVITM</text>
  </g>

  <!-- Right Ribbon: VAC & Verified Stamp -->
  <g transform="translate(770, 95)" filter="url(#shadow)">
    <rect x="-95" y="-20" width="190" height="180" rx="14" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#526B50" letter-spacing="1.2">VALUE ADDED COURSE</text>
    
    <!-- Rosette Stamp -->
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="28" fill="#DCE8D5" stroke="#526B50" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" fill="#526B50"/>
      <text x="0" y="-3" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF">SMVITM</text>
      <text x="0" y="9" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#DCE8D5">VERIFIED</text>
    </g>

    <text x="0" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">Date of Issue:</text>
    <text x="0" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#343D32">22-01-2026</text>
    
    <!-- Mini QR Code -->
    <g transform="translate(0, 138)">
      <rect x="-12" y="-12" width="24" height="24" fill="#FFFFFF" stroke="#DCE8D5"/>
      <rect x="-9" y="-9" width="6" height="6" fill="#343D32"/><rect x="3" y="-9" width="6" height="6" fill="#343D32"/>
      <rect x="-9" y="3" width="6" height="6" fill="#343D32"/><rect x="1" y="1" width="4" height="4" fill="#526B50"/>
    </g>
  </g>

  <!-- Institution Header -->
  <text x="420" y="125" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#526B50" letter-spacing="1.5">
    SHRI MADHWA VADIRAJA INSTITUTE OF TECHNOLOGY AND MANAGEMENT
  </text>
  <text x="420" y="145" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#76946C">
    Vishwothama Nagar, Bantakal, Udupi - 574 115
  </text>

  <!-- Title Area -->
  <text x="420" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="28" font-weight="900" fill="#343D32" letter-spacing="1">
    Certificate of Completion
  </text>
  <text x="420" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#526B50">
    This is to certify that
  </text>

  <!-- Recipient Name -->
  <text x="420" y="260" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" fill="#343D32" letter-spacing="1">
    Zeenath Ziyan
  </text>
  <line x1="200" y1="275" x2="640" y2="275" stroke="#526B50" stroke-width="1.8"/>

  <!-- USN & Class details -->
  <text x="420" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#526B50">
    USN: 4MW24AD058  •  III Semester, B.E. in Artificial Intelligence &amp; Data Science
  </text>

  <!-- Course description -->
  <g transform="translate(420, 335)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="500" fill="#343D32">
      has successfully completed the Value Added Course on
    </text>
    <text x="0" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#526B50" letter-spacing="0.5">
      &quot;Web Development&quot;
    </text>
    <text x="0" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#555555">
      focused on All Round Personality Development, conducted on Saturdays
    </text>
    <text x="0" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#343D32">
      between 27-09-2025 and 27-12-2025 (6 comprehensive sessions)
    </text>
  </g>

  <!-- Authorities & Signatures -->
  <!-- Left: Ms. Vidya Bhat (Coordinator) -->
  <g transform="translate(260, 500)">
    <!-- Realistic Cursive Signature -->
    <path d="M-45 -8 C-30 -25 -10 12 5 -12 C18 -25 30 2 48 -10" fill="none" stroke="#343D32" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M-25 0 C-5 8 15 -2 38 4" fill="none" stroke="#526B50" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-65" y1="12" x2="70" y2="12" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#343D32">Ms. Vidya Bhat</text>
    <text x="0" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#526B50">Coordinator</text>
  </g>

  <!-- Right: Dr. Nagaraj Bhat (Principal) -->
  <g transform="translate(580, 500)">
    <!-- Realistic Cursive Signature -->
    <path d="M-50 0 C-35 -28 -15 10 0 -15 C15 -28 32 5 50 -10 C65 -20 75 0 80 -6" fill="none" stroke="#343D32" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-30 6 C-10 -2 15 8 45 0" fill="none" stroke="#526B50" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-65" y1="12" x2="85" y2="12" stroke="#526B50" stroke-width="1.2"/>
    <text x="10" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#343D32">Dr. Nagaraj Bhat</text>
    <text x="10" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#526B50">Principal, SMVITM</text>
  </g>

  <text x="480" y="590" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#76946C">
    Affiliated to VTU Belagavi • Approved by AICTE New Delhi • Recognized by Govt. of Karnataka
  </text>
</svg>