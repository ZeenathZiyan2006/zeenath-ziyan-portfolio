<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="sageBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background in warm alabaster / light sage -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#sageBorder)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Top Logo & Emblem -->
  <g transform="translate(480, 85)">
    <!-- LearnTube pill badge -->
    <rect x="-85" y="-18" width="170" height="36" rx="8" fill="#526B50"/>
    <polygon points="-70,-6 -55,0 -70,6" fill="#A3B899"/>
    <text x="-45" y="6" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">LearnTube<tspan fill="#DCE8D5">.ai</tspan></text>
  </g>

  <!-- Laurel & Trophy Icon -->
  <g transform="translate(480, 132)">
    <circle cx="0" cy="0" r="22" fill="#DCE8D5" stroke="#526B50" stroke-width="1.5"/>
    <!-- Trophy cup -->
    <path d="M-9 -8 H9 V-2 C9 5 -9 5 -9 -2 Z" fill="#526B50"/>
    <path d="M-12 -6 H-9 V-2 C-9 0 -12 0 -12 -2 Z" stroke="#526B50" stroke-width="1.5" fill="none"/>
    <path d="M12 -6 H9 V-2 C9 0 12 0 12 -2 Z" stroke="#526B50" stroke-width="1.5" fill="none"/>
    <rect x="-2" y="5" width="4" height="6" fill="#526B50"/>
    <rect x="-6" y="11" width="12" height="3" rx="1" fill="#526B50"/>
  </g>

  <!-- Title -->
  <text x="480" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="32" font-weight="800" fill="#343D32" letter-spacing="3">
    Certificate of Completion
  </text>
  <text x="480" y="215" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#526B50" letter-spacing="2">
    PROJECT MANAGEMENT ASSESSMENT
  </text>

  <!-- Divider -->
  <line x1="390" y1="235" x2="570" y2="235" stroke="#A3B899" stroke-width="1.5"/>

  <!-- Presentation text -->
  <text x="480" y="275" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" fill="#526B50">
    This certificate is presented to
  </text>

  <!-- Recipient Name -->
  <text x="480" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="#343D32" letter-spacing="1">
    Zeenath Ziyan
  </text>
  <line x1="280" y1="345" x2="680" y2="345" stroke="#526B50" stroke-width="1.5"/>

  <!-- Purpose / Achievement Description -->
  <text x="480" y="380" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" fill="#526B50">
    for successfully completing Project Management Assessment
  </text>

  <!-- =========================================================================
       AUTHORITIES, SIGNATURES & VERIFICATION DETAILS (NO EMPTY SPACE)
       ========================================================================= -->

  <!-- Left Authority: Shronit Ladhani -->
  <g transform="translate(180, 480)">
    <!-- Realistic Cursive Handwritten Signature -->
    <path d="M-60 -10 C-45 -35 -20 5 -5 -15 C5 -30 25 -5 40 -12 C55 -18 70 0 85 -5" fill="none" stroke="#343D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-40 0 C-10 12 30 -5 60 5" fill="none" stroke="#526B50" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-70" y1="12" x2="90" y2="12" stroke="#526B50" stroke-width="1.2"/>
    <text x="10" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#343D32">Shronit Ladhani</text>
    <text x="10" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#526B50">CO-FOUNDER, LEARNTUBE</text>
  </g>

  <!-- Center: Date of Issuance & Certificate ID -->
  <g transform="translate(480, 480)">
    <rect x="-115" y="-12" width="230" height="68" rx="10" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.2" opacity="0.95"/>
    <text x="0" y="12" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#343D32">
      Date: September 12, 2025
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#526B50">
      Id: DJA-B-1-1692351-0
    </text>
    <text x="0" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="bold" fill="#76946C" letter-spacing="1">
      VERIFIED CREDENTIAL
    </text>
  </g>

  <!-- Right Authority: Gargi Ruparelia -->
  <g transform="translate(760, 480)">
    <!-- Realistic Cursive Handwritten Signature -->
    <path d="M-70 0 C-50 -30 -30 10 -15 -18 C-5 -35 15 5 35 -15 C50 -28 75 -2 80 -10" fill="none" stroke="#343D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-55 8 C-20 -2 20 8 65 -4" fill="none" stroke="#526B50" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-80" y1="12" x2="80" y2="12" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" fill="#343D32">Gargi Ruparelia</text>
    <text x="0" y="46" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#526B50">CO-FOUNDER, LEARNTUBE</text>
  </g>

  <!-- Verification QR Code Corner Badge -->
  <g transform="translate(840, 95)">
    <rect x="-28" y="-28" width="56" height="56" rx="6" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <!-- Simulated QR Grid -->
    <rect x="-22" y="-22" width="16" height="16" fill="#343D32"/><rect x="-18" y="-18" width="8" height="8" fill="#FFFFFF"/>
    <rect x="6" y="-22" width="16" height="16" fill="#343D32"/><rect x="10" y="-18" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-22" y="6" width="16" height="16" fill="#343D32"/><rect x="-18" y="10" width="8" height="8" fill="#FFFFFF"/>
    <rect x="4" y="4" width="8" height="8" fill="#526B50"/><rect x="14" y="14" width="6" height="6" fill="#343D32"/>
    <text x="0" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="bold" fill="#526B50">VERIFY HERE</text>
  </g>
</svg>
