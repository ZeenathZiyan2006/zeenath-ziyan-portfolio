<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="ieeeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <linearGradient id="ieeeSealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCE8D5"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCE8D5"/>
    </linearGradient>
  </defs>

  <!-- Background in warm alabaster / light sage palette -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#ieeeBorder)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Top IEEE Kite Logo & Institution Header -->
  <g transform="translate(480, 80)">
    <!-- IEEE Kite Diamond Emblem -->
    <polygon points="0,-28 24,0 0,28 -24,0" fill="#526B50" stroke="#343D32" stroke-width="1.5"/>
    <polygon points="0,-22 19,0 0,22 -19,0" fill="#DCE8D5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#343D32" letter-spacing="0.5">IEEE</text>
  </g>

  <!-- Subtitle / Society -->
  <text x="480" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#526B50" letter-spacing="4">
    INSTITUTE OF ELECTRICAL AND ELECTRONICS ENGINEERS
  </text>
  <text x="480" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#76946C" letter-spacing="2">
    IEEE MANGALORE SUBSECTION • REGION 10 (ASIA-PACIFIC)
  </text>

  <!-- Certificate Title -->
  <text x="480" y="196" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="30" font-weight="900" fill="#343D32" letter-spacing="2">
    Certificate of Membership
  </text>
  <line x1="360" y1="214" x2="600" y2="214" stroke="#A3B899" stroke-width="1.5"/>

  <!-- Presentation text -->
  <text x="480" y="248" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#526B50">
    This is to certify that
  </text>

  <!-- Recipient Name -->
  <text x="480" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="38" font-weight="800" fill="#343D32" letter-spacing="1">
    Zeenath Ziyan
  </text>
  <line x1="260" y1="318" x2="700" y2="318" stroke="#526B50" stroke-width="1.8"/>

  <!-- Description Body -->
  <text x="480" y="350" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#343D32">
    is a Student Member in good standing, entitled to all the rights and privileges
  </text>
  <text x="480" y="372" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#526B50">
    conferred by the Constitution and Bylaws of the IEEE.
  </text>

  <!-- =========================================================================
       CREDENTIAL BADGE & MEMBERSHIP SUMMARY (NO EMPTY SPACE)
       ========================================================================= -->
  <g transform="translate(480, 420)">
    <rect x="-260" y="-18" width="520" height="42" rx="10" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    
    <!-- Member Number -->
    <text x="-160" y="1" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">IEEE MEMBER NUMBER</text>
    <text x="-160" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="800" fill="#343D32">101696933</text>
    
    <line x1="-70" y1="-10" x2="-70" y2="20" stroke="#DCE8D5" stroke-width="1"/>

    <!-- Grade -->
    <text x="0" y="1" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">MEMBERSHIP GRADE</text>
    <text x="0" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#526B50">Student Member</text>

    <line x1="70" y1="-10" x2="70" y2="20" stroke="#DCE8D5" stroke-width="1"/>

    <!-- Validity -->
    <text x="160" y="1" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">VALID THROUGH</text>
    <text x="160" y="16" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#343D32">31 December 2026</text>
  </g>

  <!-- =========================================================================
       AUTHORITY, SIGNATURE & OFFICIAL EMBOSSED SEAL
       ========================================================================= -->

  <!-- Left: Official Subsection Attestation -->
  <g transform="translate(200, 520)">
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#343D32">IEEE Mangalore Subsection</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#526B50">LOCAL SECTION AFFILIATION</text>
    <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#76946C">Karnataka, India • Region 10</text>
  </g>

  <!-- Center: Embossed IEEE Gold/Sage Seal -->
  <g transform="translate(480, 525)">
    <circle cx="0" cy="0" r="34" fill="url(#ieeeSealGrad)" stroke="#526B50" stroke-width="1.5" filter="drop-shadow(0 2px 4px rgba(52,61,50,0.1))"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#A3B899" stroke-width="1" stroke-dasharray="3 3"/>
    <polygon points="0,-14 12,0 0,14 -12,0" fill="#526B50"/>
    <text x="0" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#343D32" letter-spacing="1">SEAL OF IEEE</text>
  </g>

  <!-- Right: IEEE President Signature -->
  <g transform="translate(760, 520)">
    <!-- Realistic Cursive Handwritten Signature: Mary Ellen Randall -->
    <path d="M-75 -10 C-60 -35 -40 8 -25 -15 C-10 -35 10 5 30 -12 C50 -25 70 -5 85 -10" fill="none" stroke="#343D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-50 2 C-20 12 15 -4 55 4" fill="none" stroke="#526B50" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-90" y1="0" x2="90" y2="0" stroke="#526B50" stroke-width="1.2"/>
    <text x="0" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#343D32">Mary Ellen Randall</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#526B50">2026 IEEE PRESIDENT</text>
    <text x="0" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#76946C">IEEE World Headquarters, NJ, USA</text>
  </g>

  <!-- Top-Right Verification QR Badge -->
  <g transform="translate(850, 90)">
    <rect x="-26" y="-26" width="52" height="52" rx="6" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <rect x="-20" y="-20" width="14" height="14" fill="#343D32"/><rect x="-17" y="-17" width="8" height="8" fill="#FFFFFF"/>
    <rect x="6" y="-20" width="14" height="14" fill="#343D32"/><rect x="9" y="-17" width="8" height="8" fill="#FFFFFF"/>
    <rect x="-20" y="6" width="14" height="14" fill="#343D32"/><rect x="-17" y="9" width="8" height="8" fill="#FFFFFF"/>
    <rect x="4" y="4" width="8" height="8" fill="#526B50"/><rect x="12" y="12" width="6" height="6" fill="#343D32"/>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="bold" fill="#526B50">VERIFIED</text>
  </g>
</svg>