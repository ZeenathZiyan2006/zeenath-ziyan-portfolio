<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="100%" height="100%">
  <defs>
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526B50"/>
      <stop offset="50%" stop-color="#A3B899"/>
      <stop offset="100%" stop-color="#526B50"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#343D32" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>
  <rect x="18" y="18" width="924" height="604" rx="12" fill="#F7F5EC" stroke="#DCE8D5" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="576" rx="8" fill="none" stroke="url(#sageGrad)" stroke-width="2"/>
  <rect x="42" y="42" width="876" height="556" rx="6" fill="none" stroke="#DCE8D5" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- Left Header: CSC Academy Emblem Pill -->
  <g transform="translate(145, 90)">
    <rect x="-70" y="-24" width="140" height="48" rx="12" fill="#526B50"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">CSC <tspan fill="#DCE8D5">ACADEMY</tspan></text>
  </g>

  <!-- Right Ribbon: Certificate ID & Date Stamp -->
  <g transform="translate(770, 95)" filter="url(#shadow)">
    <rect x="-95" y="-20" width="190" height="180" rx="14" fill="#FFFFFF" stroke="#DCE8D5" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#526B50" letter-spacing="1.2">BASIC COMPUTER COURSE</text>
    
    <!-- Rosette Stamp -->
    <g transform="translate(0, 48)">
      <circle cx="0" cy="0" r="28" fill="#DCE8D5" stroke="#526B50" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="22" fill="#526B50"/>
      <text x="0" y="-3" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF">CSC</text>
      <text x="0" y="9" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="bold" fill="#DCE8D5">VERIFIED</text>
    </g>

    <text x="0" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#76946C">Certificate No:</text>
    <text x="0" y="115" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="bold" fill="#343D32">CSC6472142272</text>
    
    <!-- Mini QR Code -->
    <g transform="translate(0, 138)">
      <rect x="-12" y="-12" width="24" height="24" fill="#FFFFFF" stroke="#DCE8D5"/>
      <rect x="-9" y="-9" width="6" height="6" fill="#343D32"/><rect x="3" y="-9" width="6" height="6" fill="#343D32"/>
      <rect x="-9" y="3" width="6" height="6" fill="#343D32"/><rect x="1" y="1" width="4" height="4" fill="#526B50"/>
    </g>
  </g>

  <!-- Title Area -->
  <text x="410" y="150" text-anchor="middle" font-family="'Plus Jakarta Sans', serif" font-size="32" font-weight="900" fill="#343D32" letter-spacing="1.5">
    Certificate of Completion
  </text>
  <text x="410" y="180" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#526B50">
    This is to certify that
  </text>

  <!-- Recipient Name -->
  <text x="410" y="240" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="36" font-weight="800" fill="#343D32" letter-spacing="1">
    ZEENATH ZIYAN
  </text>
  <line x1="180" y1="258" x2="640" y2="258" stroke="#526B50" stroke-width="1.8"/>

  <!-- Subtitle details -->
  <text x="410" y="285" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#526B50">
    Daughter of SIRAJ
  </text>

  <!-- Course details description -->
  <g transform="translate(410, 325)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#343D32">
      has successfully completed the
    </text>
    <text x="0" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#526B50" letter-spacing="1">
      Basic Computer Course (BCC)
    </text>
    <text x="0" y="60" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#666666">
      Covering Computer Fundamentals, Operating Systems, Word Processing, Spreadsheets, Internet &amp; Digital Services
    </text>
  </g>

  <!-- Signatures & Authority Section -->
  <!-- Left: Place & Date -->
  <g transform="translate(240, 485)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#343D32">Place: New Delhi</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#526B50">Date: 06-09-2025</text>
    <line x1="-70" y1="36" x2="70" y2="36" stroke="#DCE8D5" stroke-width="1.2"/>
    <text x="0" y="52" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#76946C">Issuing Authority</text>
  </g>

  <!-- Right: Naveen Sharma Signature -->
  <g transform="translate(580, 485)">
    <!-- Realistic Cursive Signature -->
    <path d="M-50 -10 C-35 -30 -10 15 5 -15 C20 -30 35 5 55 -8 C70 -18 80 5 85 -5" fill="none" stroke="#343D32" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-30 2 C-5 10 25 -2 55 6" fill="none" stroke="#526B50" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-70" y1="14" x2="90" y2="14" stroke="#526B50" stroke-width="1.2"/>
    <text x="10" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#343D32">Naveen Sharma</text>
    <text x="10" y="50" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#526B50">COO, CSC Academy</text>
  </g>

  <!-- Footer note -->
  <text x="480" y="590" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="500" fill="#76946C">
    CSC Academy is an initiative under Ministry of Electronics &amp; IT, Government of India
  </text>
</svg>